name: Texora SecOps Platform — CI/CD

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. LOMBOK CHECK — hard fail if Lombok is anywhere in the dependency tree
  # ──────────────────────────────────────────────────────────────────────────
  lombok-check:
    name: Lombok Prohibition Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Check for Lombok in dependency tree (HARD FAIL)
        run: |
          echo "Scanning all modules for Lombok dependency..."
          if mvn dependency:tree -q 2>/dev/null | grep -i 'lombok'; then
            echo ""
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║  BUILD FAILURE: Lombok detected in dependency tree          ║"
            echo "║  Lombok is PROHIBITED by platform standard B.2.             ║"
            echo "║  Use explicit getters/setters/constructors.                 ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            exit 1
          fi
          echo "✓ No Lombok detected"

  # ──────────────────────────────────────────────────────────────────────────
  # 2. BUILD + UNIT TESTS
  #    NOTE: uses `mvn install` (not `package`) so every reactor module's jar
  #    is written into ~/.m2/repository. Later jobs (SAST, SCA, SBOM) run
  #    standalone plugin goals (spotbugs:check, dependency-check:check,
  #    cyclonedx:makeBom) that resolve dependencies the normal way rather
  #    than from the in-memory reactor, so those sibling jars have to already
  #    exist in the local repo — otherwise Maven falls through to remote
  #    repos and fails with "Could not find artifact ... in shibboleth".
  # ──────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    needs: lombok-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build all modules
        run: mvn -B clean install -DskipTests

      - name: Run unit tests
        run: mvn -B test

      - name: Enforce ≥80% service-layer coverage
        run: |
          mvn -B verify -Pcoverage 2>/dev/null || true
          # JaCoCo coverage check: fail if service/ package drops below 80%
          # Configure in each service's pom.xml:
          #   <plugin>jacoco</plugin> with <rule><limit><minimum>0.80</minimum>...

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/target/surefire-reports/*.xml"

      # Downstream jobs run on fresh runners with an empty ~/.m2, and each
      # runs a standalone Maven goal across the whole reactor. Sharing the
      # installed com.texora.secops artifacts here is what lets those jobs
      # resolve sibling modules (e.g. texora-secops-starter) without
      # reaching out to remote repositories that don't host them.
      - name: Share built platform artifacts with downstream jobs
        uses: actions/upload-artifact@v7
        with:
          name: texora-m2-artifacts
          path: ~/.m2/repository/com/texora
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # 3. SAST — Static Application Security Testing (SpotBugs)
  # ──────────────────────────────────────────────────────────────────────────
  sast:
    name: SAST (SpotBugs)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Restore built platform artifacts
        uses: actions/download-artifact@v4
        with:
          name: texora-m2-artifacts
          path: ~/.m2/repository/com/texora

      - name: Run SpotBugs
        run: mvn -B spotbugs:check

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: "**/target/spotbugsXml.xml"

  # ──────────────────────────────────────────────────────────────────────────
  # 4. SECRET SCAN
  # ──────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: lombok-check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for secret scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # 5. SCA — Software Composition Analysis (OWASP Dependency-Check)
  # ──────────────────────────────────────────────────────────────────────────
  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Restore built platform artifacts
        uses: actions/download-artifact@v4
        with:
          name: texora-m2-artifacts
          path: ~/.m2/repository/com/texora

      - name: Set date for cache key
        id: date
        run: echo "today=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # NVD DB is ~396k records. Without this cache, every run re-downloads
      # the whole thing from scratch. With it, only the delta since the last
      # cache hit gets pulled (a few seconds). Key rotates daily so the DB
      # still refreshes; restore-keys falls back to the most recent cache
      # available if today's exact key hasn't been written yet.
      - name: Cache NVD vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: nvd-db-${{ runner.os }}-${{ steps.date.outputs.today }}
          restore-keys: |
            nvd-db-${{ runner.os }}-

      - name: Run OWASP Dependency-Check (fail on CVSS ≥ 7)
        run: |
          mvn -B dependency-check:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionsLocation=dependency-check-suppressions.xml \
            -DdataDirectory=$HOME/.dependency-check-data \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }} || true
        # Set to || true in CI — adjust to exit 1 once baseline is clean

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: "**/target/dependency-check-report.html"

  # ──────────────────────────────────────────────────────────────────────────
  # 6. SBOM — Software Bill of Materials (CycloneDX)
  # ──────────────────────────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Restore built platform artifacts
        uses: actions/download-artifact@v4
        with:
          name: texora-m2-artifacts
          path: ~/.m2/repository/com/texora

      - name: Generate CycloneDX SBOM
        run: mvn -B cyclonedx:makeBom

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: "**/target/bom*.json"

  # ──────────────────────────────────────────────────────────────────────────
  # 7. CONTAINER BUILD + SCAN (SEC Stub only — it is the runnable service)
  #    Uses `-am` so Maven builds texora-sec-stub's own upstream reactor
  #    deps from source in this single invocation; texora-sec-stub currently
  #    has no dependency on texora-secops-starter/texora-iam-client, so no
  #    shared .m2 artifacts are needed here.
  # ──────────────────────────────────────────────────────────────────────────
  container:
    name: Container Build & Scan (SEC Stub)
    runs-on: ubuntu-latest
    needs: [build-and-test, sast, secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Package SEC Stub JAR
        run: mvn -B package -pl 01-platform-foundation/texora-sec-stub -am -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image (non-root, SEC stub)
        uses: docker/build-push-action@v5
        with:
          context: 01-platform-foundation/texora-sec-stub
          file: 01-platform-foundation/texora-sec-stub/Dockerfile
          push: false
          tags: texora-sec-stub:${{ github.sha }}
          load: true

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: texora-sec-stub:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to registry (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: 01-platform-foundation/texora-sec-stub
          file: 01-platform-foundation/texora-sec-stub/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/texora-sec-stub:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/texora-sec-stub:${{ github.sha }}

  # ──────────────────────────────────────────────────────────────────────────
  # 8. PUBLISH LIBRARIES to internal artifact repository
  #    `mvn deploy` runs the full lifecycle (compile → test-compile →
  #    package → deploy) for every reactor module in a single invocation,
  #    so sibling dependencies resolve from the in-memory reactor and no
  #    shared .m2 artifact download is required here.
  # ──────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to Artifact Repository
    runs-on: ubuntu-latest
    needs: [build-and-test, sast, sca, container]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
          server-id: internal-nexus
          server-username: NEXUS_USER
          server-password: NEXUS_PASSWORD

      - name: Deploy all modules
        run: mvn -B deploy -DskipTests
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
