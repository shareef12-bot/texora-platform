# =============================================================================
# application.yml — BASE config, identical in every environment.
# Copy this whole 4-file pattern into every service's src/main/resources/.
# =============================================================================
#
# HOW THIS WORKS (see Real-World-Engineering-Workflow.md Q4 for the full
# explanation):
#   - ONE Docker image is built and promoted unchanged through dev/staging/prod
#   - Only SPRING_PROFILES_ACTIVE (set as a K8s/docker-compose env var, NOT
#     baked into the image) picks which of the 3 override files below applies
#   - application-prod.yml contains ${ENV_VAR} REFERENCES only — never a real
#     secret value. Real values come from K8s Secrets / your local .env file
#     (which is gitignored, see .gitignore)
#
# =============================================================================

server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: sso-service   # <-- change per service
  lifecycle:
    timeout-per-shutdown-phase: 20s

  jpa:
    open-in-view: false          # never leave this true — causes N+1 surprises
    hibernate:
      ddl-auto: validate         # schema changes go through Flyway, never Hibernate auto-DDL
    properties:
      hibernate:
        default_batch_fetch_size: 25   # mitigates N+1 on lazy collections platform-wide

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true            # exposes /actuator/health/liveness and /readiness
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.texora: INFO
