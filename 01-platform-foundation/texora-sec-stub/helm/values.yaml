replicaCount: 1

image:
  repository: ghcr.io/texora/texora-secops-platform/texora-sec-stub
  pullPolicy: IfNotPresent
  tag: ""  # overridden at deploy time with git SHA

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: "texora-sec-stub"

service:
  type: ClusterIP
  port: 8080

# Non-root security context (standard B.9)
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 5

# Deploy to the secops-dev namespace only
namespace: secops-dev

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: SERVER_PORT
    value: "8080"

# Default stub behaviour — fail closed (DENY) unless rules say otherwise
stubConfig:
  defaultDecision: DENY
