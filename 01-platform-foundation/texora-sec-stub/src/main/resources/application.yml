server:
  port: 8080

spring:
  application:
    name: texora-sec-stub
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

texora:
  sec:
    stub:
      # Global fallback when no rule matches. Fail-closed by default; set to PERMIT only for local experimentation.
      default-decision: DENY
      rules:
        # Example rules — override or extend in sec-stub-rules.yml
        - resourceType: VPN_GATEWAY
          action: CONNECT
          decision: PERMIT
          reason: "Stub: VPN connect permitted for all in dev"
          policyId: "aaaaaaaa-0000-0000-0000-000000000001"

        - resourceType: AUDIT_LOG
          action: DELETE
          decision: DENY
          reason: "Stub: Audit log deletion always denied"

        - resourceType: LDAP_USER
          action: DISABLE
          decision: PERMIT
          reason: "Stub: LDAP disable permitted"
          policyId: "aaaaaaaa-0000-0000-0000-000000000002"
