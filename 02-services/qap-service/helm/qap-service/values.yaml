replicaCount: 2

image:
  repository: ghcr.io/texora/qap-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8090

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

env:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/texora"
  SPRING_DATASOURCE_USERNAME: "texora"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  IAM_ISSUER_URI: "http://iam-service/realms/texora"
  SEC_BASE_URL: "http://sec-service"
  SIEM_QUERY_URL: "http://siem-service/api/v1/events/search"

secrets:
  dbPasswordSecretName: "qap-db-secret"
  dbPasswordKey: "password"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8090
  initialDelaySeconds: 60
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8090
  initialDelaySeconds: 30
  periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
