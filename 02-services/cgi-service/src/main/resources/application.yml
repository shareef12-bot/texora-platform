# NOTE: do not set server.port here. Run locally with:  --server.port=8089   (KNOWN-INTEGRATION-PITFALLS #12)
# NOTE: no secret has a default in this file. Credentials are injected via environment / secret mount.
spring:
  application:
    name: cgi-service
  datasource:
    url: ${CGI_DB_URL:jdbc:postgresql://localhost:5432/texora}
    username: ${CGI_DB_USER:cgi_app}
    password: ${CGI_DB_PASSWORD}          # required, no default
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                  # schema is owned by Flyway
    properties:
      hibernate:
        default_schema: cgi
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: cgi
    default-schema: cgi
    create-schemas: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${CGI_KAFKA_BOOTSTRAP:localhost:9092}
  jackson:
    default-property-inclusion: non_null

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health            # health only; /actuator/health is internal-network only (LLD 6.1)
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${CGI_TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${CGI_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    enabled: ${CGI_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${CGI_API_DOCS_ENABLED:true}

cgi:
  security:
    expose-api-docs: false          # true only in the "local" profile
  execution:
    adapter: stub                   # LOCAL STUB - see README. A real adapter replaces this per ADR-D5.
    max-concurrent-workers: 16
    max-timeout-ceiling-seconds: 120
    max-request-body-bytes: 1048576
    max-response-bytes: 2097152
    default-sandbox-profile: strict-default
  sec:
    base-url: ${CGI_SEC_BASE_URL:http://localhost:8083}   # sec-stub local port (pitfall #12)
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
    ssl-bundle: ${CGI_SEC_SSL_BUNDLE:}                    # name of a spring.ssl.bundle.* for mTLS; empty = plain (local only)
  audit:
    topic: cgi.audit.events
    send-timeout-ms: 3000
    retry-interval-ms: 30000
    retry-min-age-ms: 10000
    max-forward-attempts: 1000
  redaction:
    extra-sensitive-keys: []
