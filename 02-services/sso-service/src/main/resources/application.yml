spring:
  application:
    name: sso-service

  datasource:
    url: ${SSO_DB_URL:jdbc:postgresql://localhost:5432/texora_secops}
    username: ${SSO_DB_USER:sso_app}
    password: ${SSO_DB_PASSWORD:}
    hikari:
      schema: sso

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: sso

  flyway:
    schemas: sso
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SSO_REDIS_HOST:localhost}
      port: ${SSO_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${SSO_KAFKA_BOOTSTRAP:localhost:9092}
    topic:
      audit-events: sso.audit.events

  security:
    oauth2:
      resourceserver:
        jwt:
          # Points at this service's own /oauth2/jwks endpoint (self-issued tokens).
          # Signature, audience ("texora-secops"), and issuer checks are all enabled
          # by Spring Security's defaults here — none are relaxed. NO custom crypto.
          issuer-uri: ${SSO_ISSUER_URI:https://sso.texora.internal}
          jwk-set-uri: ${SSO_JWKS_URI:https://sso.texora.internal/oauth2/jwks}
      authorizationserver:
        issuer: ${SSO_ISSUER_URI:https://sso.texora.internal}
      saml2:
        relyingparty:
          registration:
            # Per-product SAML relying-party registrations are added here as each
            # product (ilmora, texora-jobs, taskorbit, hrms, crm — ADR D-3) confirms
            # SAML rather than OIDC for its integration.
            placeholder:
              signing:
                credentials: []

texora:
  sso:
    ldap-service:
      base-url: ${LDAP_SERVICE_BASE_URL:}
      stub-mode: ${LDAP_SERVICE_STUB_MODE:true}
    dc-service:
      base-url: ${DC_SERVICE_BASE_URL:}
      stub-mode: ${DC_SERVICE_STUB_MODE:true}
    sec-service:
      base-url: ${SEC_SERVICE_BASE_URL:http://sec-service.texora-secops.svc.cluster.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector.texora-secops.svc.cluster.local:4318/v1/traces}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.texora.secops.sso: INFO
